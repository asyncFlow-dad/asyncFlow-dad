# gh-ascii — daily card refresh
#
# Re-downloads both themes once a day and uploads them to the profile gist,
# so stars/followers/Uptime stay current without bot commits on main.
# Needs secret GIST_TOKEN: a PAT with gist write access only.
#
# Heads-up: GitHub disables scheduled workflows after 60 days of repo
# inactivity. Profile repos are quiet by design — if the card stops updating,
# re-enable from the Actions tab ("Run workflow" also works as a manual check).

name: Refresh gh-ascii card

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profile-gist
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Download both themes
        env:
          HANDLE: asyncFlow-dad
          GH_ASCII_URL: https://gh.crafter.run
        run: |
          curl -fsSL --retry 3 --retry-delay 5 \
            "$GH_ASCII_URL/$HANDLE?theme=dark" \
            -o dark_mode.svg
          curl -fsSL --retry 3 --retry-delay 5 \
            "$GH_ASCII_URL/$HANDLE?theme=light" \
            -o light_mode.svg

      - name: Upload to gist
        env:
          GH_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: a4419b43713bb3e6724fcbb338694ebd
        run: |
          jq -n --rawfile d dark_mode.svg --rawfile l light_mode.svg \
            '{files: {"dark_mode.svg": {content: $d}, "light_mode.svg": {content: $l}}}' \
            | gh api -X PATCH "gists/$GIST_ID" --input - --silent
