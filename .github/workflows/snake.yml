name: generate snake

on:
  schedule:
    - cron: "0 0 * * *" # 매일 00:00 UTC 갱신
  workflow_dispatch: # 수동 실행 버튼

permissions:
  contents: read
  actions: write # keep-alive below

concurrency:
  group: profile-gist
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: generate snake svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: upload to gist
        env:
          GH_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: a4419b43713bb3e6724fcbb338694ebd
        run: |
          jq -n --rawfile l dist/github-contribution-grid-snake.svg \
                --rawfile d dist/github-contribution-grid-snake-dark.svg \
            '{files: {"github-contribution-grid-snake.svg": {content: $l},
                      "github-contribution-grid-snake-dark.svg": {content: $d}}}' \
            | gh api -X PATCH "gists/$GIST_ID" --input - --silent

      # ponytail: no more bot commits on main, so GitHub may disable this
      # schedule after 60 quiet days. Re-enabling via API should reset that timer
      # (same trick as keepalive-workflow's API mode).
      - name: keep schedule alive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/snake.yml/enable"
